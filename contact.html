<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Anan Hoque</title>
  <meta name="description" content="Get in touch with Anan Hoque, an architecture studio designing residential, cultural and civic buildings shaped by light, material and site." />
  <meta name="theme-color" content="#14130f" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- custom cursor -->
  <div class="cursor" aria-hidden="true">
    <div class="cursor-ring"><span class="cursor-label"></span></div>
    <div class="cursor-dot"></div>
  </div>

  <!-- preloader -->
  <div class="preloader" id="preloader">
    <div class="preloader-inner">
      <svg class="preloader-mark" viewBox="0 0 90 60" fill="none" aria-hidden="true">
        <line x1="6" y1="52" x2="21" y2="8" />
        <line x1="21" y1="8" x2="36" y2="52" />
        <line x1="12.5" y1="34" x2="30.5" y2="34" />
        <line x1="55" y1="8" x2="55" y2="52" />
        <line x1="79" y1="8" x2="79" y2="52" />
        <line x1="55" y1="30" x2="79" y2="30" />
      </svg>
      <div class="preloader-bar"><span class="preloader-bar-fill"></span></div>
      <div class="preloader-count"><span id="preloader-percent">0</span><small>%</small></div>
    </div>
  </div>

  <header class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo" data-cursor="link">Anan&nbsp;Hoque</a>
      <nav class="nav-links" aria-label="Primary">
        <a href="/" data-cursor="link">Work</a>
        <a href="/about.html" data-cursor="link">About</a>
        <a href="/contact.html" data-cursor="link">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="contact" data-theme="dark">
      <div class="contact-inner">
        <span class="contact-eyebrow" data-reveal>Contact</span>
        <h1 class="contact-title" data-reveal>Let's design <em>what's next.</em></h1>
        <a href="mailto:studio@ananhoque.com" class="contact-email" data-copy data-magnetic data-cursor="view" data-reveal>
          <span class="copy-toast">Copied</span>
          studio@ananhoque.com
        </a>
        <div class="contact-meta" data-reveal>
          <div>
            <span>Studio</span>
            <p>Based worldwide — studio visits by appointment.</p>
          </div>
          <div>
            <span>Social</span>
            <p><a href="#" data-cursor="link">Instagram</a> · <a href="#" data-cursor="link">LinkedIn</a></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-theme="dark">
    <div class="site-footer-inner">
      <p>© 2026 Anan Hoque Architecture. All rights reserved.</p>
      <button class="to-top" data-to-top data-magnetic data-cursor="link" aria-label="Back to top">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M12 5L5 12M12 5L19 12" /></svg>
      </button>
    </div>
  </footer>

  <script type="module" src="/src/static-page-main.js"></script>
</body>
</html>
