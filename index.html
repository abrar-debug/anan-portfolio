<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anan Hoque — Architecture Studio</title>
  <meta name="description" content="Anan Hoque is an architecture studio designing residential, cultural and civic buildings shaped by light, material and site." />
  <meta name="theme-color" content="#14130f" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- custom cursor -->
  <div class="cursor" aria-hidden="true">
    <div class="cursor-ring"><span class="cursor-label"></span></div>
    <div class="cursor-dot"></div>
  </div>

  <!-- preloader -->
  <div class="preloader" id="preloader">
    <div class="preloader-inner">
      <svg class="preloader-mark" viewBox="0 0 90 60" fill="none" aria-hidden="true">
        <line x1="6" y1="52" x2="21" y2="8" />
        <line x1="21" y1="8" x2="36" y2="52" />
        <line x1="12.5" y1="34" x2="30.5" y2="34" />
        <line x1="55" y1="8" x2="55" y2="52" />
        <line x1="79" y1="8" x2="79" y2="52" />
        <line x1="55" y1="30" x2="79" y2="30" />
      </svg>
      <div class="preloader-bar"><span class="preloader-bar-fill"></span></div>
      <div class="preloader-count"><span id="preloader-percent">0</span><small>%</small></div>
    </div>
  </div>

  <header class="site-nav">
    <div class="nav-inner">
      <span class="nav-logo">Anan&nbsp;Hoque</span>
      <a href="mailto:studio@ananhoque.com" class="nav-cta" data-cursor="link">Contact</a>
    </div>
  </header>

  <main id="main">
    <section id="work" class="work-hero" data-theme="dark" data-index-carousel>
      <div class="hero-slides">
        <div class="hero-slide active" data-index-slide data-index-title="Meridian House" data-index-meta="Residential — Private Residence — 2024">
          <svg class="project-art" viewBox="0 0 400 300" fill="none">
            <path d="M40 40 H260 V140 H360 V260 H40 Z" />
            <rect x="90" y="90" width="120" height="120" />
            <circle cx="150" cy="150" r="18" />
            <path d="M260 140 A40 40 0 0 1 220 180" />
          </svg>
        </div>

        <div class="hero-slide" data-index-slide data-index-title="The Kiln Pavilion" data-index-meta="Cultural — Public Pavilion — 2023">
          <svg class="project-art" viewBox="0 0 400 300" fill="none">
            <path d="M25 260 V180 A35 35 0 0 1 95 180 V260" />
            <path d="M115 260 V180 A35 35 0 0 1 185 180 V260" />
            <path d="M205 260 V180 A35 35 0 0 1 275 180 V260" />
            <path d="M295 260 V180 A35 35 0 0 1 365 180 V260" />
            <line x1="10" y1="260" x2="390" y2="260" />
          </svg>
        </div>

        <div class="hero-slide" data-index-slide data-index-title="Ridgeline House" data-index-meta="Residential — Private Residence — 2024">
          <div class="hero-slide-hatch hatch-concrete"></div>
        </div>

        <div class="hero-slide" data-index-slide data-index-title="Threshold Cultural Center" data-index-meta="Civic — Cultural Institution — 2022">
          <svg class="project-art" viewBox="0 0 400 300" fill="none">
            <rect x="40" y="200" width="320" height="60" />
            <rect x="80" y="150" width="240" height="50" />
            <rect x="120" y="100" width="160" height="50" />
            <rect x="160" y="60" width="80" height="40" />
          </svg>
        </div>

        <div class="hero-slide" data-index-slide data-index-title="Harbor Light Studio" data-index-meta="Interiors — Studio Fit-out — 2022">
          <div class="hero-slide-hatch hatch-timber"></div>
        </div>

        <div class="hero-slide" data-index-slide data-index-title="Cedar Court" data-index-meta="Residential — Multi-Unit Housing — 2021">
          <svg class="project-art" viewBox="0 0 400 300" fill="none">
            <rect x="60" y="40" width="280" height="220" />
            <line x1="60" y1="80" x2="340" y2="80" />
            <line x1="60" y1="120" x2="340" y2="120" />
            <line x1="60" y1="160" x2="340" y2="160" />
            <line x1="60" y1="200" x2="340" y2="200" />
            <line x1="200" y1="40" x2="200" y2="260" />
          </svg>
        </div>

        <div class="hero-slide" data-index-slide data-index-title="Salt Store Renovation" data-index-meta="Cultural — Adaptive Reuse — 2023">
          <div class="hero-slide-hatch hatch-brick"></div>
        </div>

        <div class="hero-slide" data-index-slide data-index-title="Long Room Gallery" data-index-meta="Interiors — Gallery Fit-out — 2020">
          <svg class="project-art" viewBox="0 0 400 300" fill="none">
            <line x1="20" y1="240" x2="380" y2="240" />
            <path d="M40 240 L90 100 L140 240" />
            <path d="M150 240 L200 100 L250 240" />
            <path d="M260 240 L310 100 L360 240" />
            <rect x="80" y="90" width="20" height="10" />
            <rect x="190" y="90" width="20" height="10" />
            <rect x="300" y="90" width="20" height="10" />
          </svg>
        </div>
      </div>

      <div class="hero-scrim" aria-hidden="true"></div>

      <div class="hero-overlay">
        <div class="hero-overlay-text" aria-live="polite">
          <p class="hero-overlay-meta" data-index-meta-el>Residential — Private Residence — 2024</p>
          <h2 class="hero-overlay-title" data-index-title-el>Meridian House</h2>
        </div>

        <button type="button" class="hero-cta" data-index-next data-cursor="view">
          <span class="hero-cta-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M20 11A8 8 0 1 0 18.5 16" /><path d="M20 5V11H14" /></svg>
          </span>
          <span class="hero-cta-label">Read more about this project</span>
          <span class="hero-cta-counter">
            <span class="hero-cta-counter-current" data-index-counter-current>01</span>
            <span class="hero-cta-counter-sep">/</span>
            <span data-index-counter-total>08</span>
          </span>
        </button>
      </div>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
